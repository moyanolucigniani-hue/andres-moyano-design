
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>ANDRES MOYANO | Creative Portfolio</title>
<meta name="description" content="Andres Moyano - Creative Direction, Branding, Advertising and Digital Experiences">

<style>
@font-face {
  font-family: "FuturaMaxi";
  src: url("Futura%20Maxi%20CG%20Bold%20Regular.otf") format("opentype"); 
  font-weight: 700;
  font-display: swap;
}

:root {
  --red: #f21d36;
  --black: #080808;
  --white: #ffffff;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--black);
  color: var(--white);
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

/* MENU */

.main-header {
  position: absolute;
  z-index: 20;
  top: 0;
  left: 0;
  width: 100%;
  min-height: 76px;
  padding: 18px 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.8),
    rgba(0,0,0,0)
  );
}

.brand {
  color: white;
  font-size: 28px;
  font-weight: 900;
  text-decoration: none;
}

.brand span {
  color: var(--red);
}

.main-nav {
  display: flex;
  align-items: center;
  gap: 27px;
}

.main-nav a,
.language {
  color: white;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
  text-decoration: none;
  background: none;
  border: 0;
  cursor: pointer;
  transition: color .3s ease;
}

.main-nav a:hover,
.language:hover {
  color: var(--red);
}

.menu-toggle {
  display: none;
  color: white;
  background: none;
  border: 0;
  font-size: 30px;
  cursor: pointer;
}

/* PORTADA */

.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100svh;
  min-height: 650px;
  max-height: 1100px;
  overflow: hidden;
  isolation: isolate;
  background: #080808;
}

/* FONDO ANIMADO */

.wall {
  position: absolute;
  z-index: -4;
  inset: -5%;
  background-image: url("fondo.png");
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  animation: wallMovement 18s ease-in-out 1 both;
  will-change: transform;
}

@keyframes wallMovement {
  0% {
    transform: scale(1.12) translateX(2%);
  }
  45% {
    transform: scale(1.20) translateX(-1%);
  }
  100% {
    transform: scale(1.14) translateX(1%);
  }
}

/* ILUMINACION */

.dark-layer {
  position: absolute;
  z-index: -3;
  inset: 0;
  background:
    radial-gradient(
      ellipse at 50% 45%,
      rgba(0,0,0,.05),
      rgba(0,0,0,.55) 85%
    ),
    linear-gradient(
      90deg,
      rgba(0,0,0,.3),
      transparent 50%,
      rgba(0,0,0,.3)
    );
}

.red-light {
  position: absolute;
  z-index: -2;
  top: -20%;
  left: -40%;
  width: 35%;
  height: 150%;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,0,35,.04),
    rgba(255,0,35,.42),
    rgba(255,0,35,.08),
    transparent
  );
  filter: blur(22px);
  transform: skewX(-20deg);
  animation: redSweep 5s ease-in-out 1.5s 1 both;
  pointer-events: none;
}

@keyframes redSweep {
  0% {
    left: -40%;
    opacity: 0;
  }
  25% {
    opacity: 1;
  }
  75% {
    opacity: .8;
  }
  100% {
    left: 120%;
    opacity: 0;
  }
}

/* PARTICULAS */

.particles {
  position: absolute;
  z-index: -1;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(circle, rgba(255,40,60,.8) 1px, transparent 2px),
    radial-gradient(circle, rgba(255,255,255,.5) 1px, transparent 2px),
    radial-gradient(circle, rgba(255,30,50,.6) 1px, transparent 2px);
  background-size: 170px 190px, 240px 230px, 310px 270px;
  background-position: 20px 40px, 100px 120px, 200px 30px;
  opacity: .35;
  animation: particlesMove 14s linear 1 both;
}

@keyframes particlesMove {
  from {
    background-position: 20px 40px, 100px 120px, 200px 30px;
    opacity: 0;
  }
  to {
    background-position: 20px -160px, 100px -80px, 200px -170px;
    opacity: .35;
  }
}

/* RETRATO FIJO */

.portrait {
  position: absolute;
  z-index: 2;
  bottom: 0;
  right: 7%;
  height: 91%;
  width: auto;
  max-width: 54%;
  object-fit: contain;
  object-position: bottom center;
  filter: grayscale(100%) contrast(1.05);
  opacity: 0;
  animation: portraitAppear 1.5s ease-out .5s forwards;
  pointer-events: none;
}

@keyframes portraitAppear {
  from {
    opacity: 0;
    transform: translateY(35px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* NOMBRE 3D */

.hero-title {
  position: absolute;
  z-index: 5;
  top: 43%;
  left: 50%;
  width: 90%;
  transform: translate(-50%, -50%);
  text-align: center;
  perspective: 1000px;
}

.animated-name {
  margin: 0;
  color: var(--red);
  font-family: "FuturaMaxi", sans-serif;
  font-size: clamp(45px, 8.2vw, 116px);
  font-weight: 700;
  line-height: .98;
  letter-spacing: -2px;
  white-space: nowrap;

  text-shadow:
    1px 1px 0 #c10b24,
    2px 2px 0 #b50920,
    3px 3px 0 #990719,
    4px 4px 0 #780615,
    5px 5px 0 #59030f,
    7px 8px 12px rgba(0,0,0,.85),
    0 0 24px rgba(255,20,50,.35);

  opacity: 0;
  animation: name3D 1.5s cubic-bezier(.16,1,.3,1) 1s forwards;
}

@keyframes name3D {
  0% {
    opacity: 0;
    transform: translateZ(-500px) rotateX(35deg) scale(.45);
    filter: blur(12px);
  }
  70% {
    opacity: 1;
    transform: translateZ(35px) rotateX(-5deg) scale(1.04);
    filter: blur(0);
  }
  100% {
    opacity: 1;
    transform: translateZ(0) rotateX(0) scale(1);
    filter: blur(0);
  }
}

/* DESTELLO EN EL NOMBRE */

.name-glow {
  position: relative;
  display: inline-block;
}

.name-glow::after {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 45%;
  height: 100%;
  background: linear-gradient(
    100deg,
    transparent,
    rgba(255,255,255,.7),
    transparent
  );
  transform: skewX(-20deg);
  animation: nameShine 1.2s ease-in-out 2.8s 1 both;
  pointer-events: none;
}

@keyframes nameShine {
  to {
    left: 150%;
  }
}

/* FIRMA */

.signature {
  margin-top: 12px;
  color: white;
  font-family: "Brush Script MT", "Segoe Script", cursive;
  font-size: clamp(55px, 8vw, 105px);
  line-height: 1;
  text-align: center;
  text-shadow: 0 4px 15px rgba(0,0,0,.8);
  opacity: 0;
  clip-path: inset(0 100% 0 0);
  animation: signatureWrite 2s ease-out 2.7s forwards;
}

@keyframes signatureWrite {
  0% {
    opacity: 0;
    clip-path: inset(0 100% 0 0);
  }
  100% {
    opacity: 1;
    clip-path: inset(0 0 0 0);
  }
}

/* TEXTO INFERIOR */

.hero-bottom {
  position: absolute;
  z-index: 6;
  bottom: 24px;
  left: 5%;
  right: 5%;
  display: flex;
  justify-content: space-between;
  color: white;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 2px;
  text-shadow: 0 2px 8px black;
}

/* TABLETAS */

@media (max-width: 1024px) {
  .portrait {
    right: 1%;
    height: 82%;
    max-width: 62%;
  }

  .hero-title {
    top: 43%;
    width: 96%;
  }

  .animated-name {
    font-size: clamp(48px, 8.5vw, 88px);
  }
}

/* CELULARES */

@media (max-width: 760px) {
  .main-header {
    min-height: 65px;
    padding: 14px 5%;
  }

  .menu-toggle {
    display: block;
  }

  .main-nav {
    display: none;
    position: absolute;
    top: 65px;
    left: 0;
    right: 0;
    padding: 25px;
    background: rgba(0,0,0,.97);
    flex-direction: column;
    align-items: flex-start;
    gap: 24px;
  }

  .main-nav.open {
    display: flex;
  }

  .main-nav a,
  .language {
    font-size: 13px;
  }

  .hero {
    min-height: 680px;
    max-height: 900px;
  }

  .wall {
    background-position: center;
  }

  .portrait {
    height: 65%;
    max-width: 90%;
    right: 50%;
    transform: translateX(50%);
    animation: portraitMobile 1.5s ease-out .5s forwards;
  }

  @keyframes portraitMobile {
    from {
      opacity: 0;
      transform: translate(50%, 35px);
    }
    to {
      opacity: 1;
      transform: translate(50%, 0);
    }
  }

  .hero-title {
    top: 38%;
    width: 96%;
    padding: 10px;
  }

  .animated-name {
    white-space: normal;
    font-size: clamp(34px, 9.5vw, 65px);
    letter-spacing: -1px;
    line-height: 1.05;
  }

  .signature {
    font-size: clamp(48px, 12vw, 75px);
    margin-top: 8px;
  }

  .hero-bottom {
    bottom: 15px;
    font-size: 8px;
    letter-spacing: 1px;
    gap: 10px;
  }
}

/* CELULARES PEQUEÑOS */

@media (max-width: 380px) {
  .hero {
    min-height: 620px;
  }

  .portrait {
    height: 59%;
  }

  .hero-title {
    top: 36%;
  }

  .animated-name {
    font-size: 34px;
  }

  .hero-bottom {
    flex-direction: column;
    align-items: center;
  }
}

/* MOVIMIENTO REDUCIDO */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-delay: 0ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }

  .wall,
  .portrait,
  .animated-name,
  .signature {
    opacity: 1;
    clip-path: none;
    transform: none;
  }
}
</style>
</head>

<body>

<header class="main-header">
  <a href="#inicio" class="brand">AM<span>.</span></a>

  <button class="menu-toggle"
          aria-label="Abrir menú"
          aria-expanded="false"
          aria-controls="main-nav">
    ☰
  </button>

  <nav class="main-nav" id="main-nav">
    <a href="#inicio">INICIO</a>
    <a href="#proyectos">PROYECTOS</a>
    <a href="#sobre-mi">SOBRE MÍ</a>
    <a href="#servicios">SERVICIOS</a>
    <a href="#contacto">CONTACTO</a>
    <button class="language" type="button">ES / EN</button>
  </nav>
</header>

<main>
<section class="hero" id="inicio">

  <div class="wall"></div>
  <div class="dark-layer"></div>
  <div class="red-light"></div>
  <div class="particles"></div>

  <img
    class="portrait"
    src="andres.png"
    alt="Andres Moyano"
    fetchpriority="high"
  >

  <div class="hero-title">
    <h1 class="animated-name">
      <span class="name-glow">ANDRES MOYANO</span>
    </h1>
    <div class="signature">Design</div>
  </div>

  <div class="hero-bottom">
    <span>CREATIVIDAD · ESTRATEGIA · DISEÑO</span>
    <span>COLOMBIA — 2026</span>
  </div>

</section>
</main>

<script>
const menuButton = document.querySelector(".menu-toggle");
const mainNav = document.querySelector(".main-nav");

menuButton.addEventListener("click", () => {
  const isOpen = mainNav.classList.toggle("open");

  menuButton.setAttribute("aria-expanded", isOpen);
  menuButton.setAttribute(
    "aria-label",
    isOpen ? "Cerrar menú" : "Abrir menú"
  );

  menuButton.textContent = isOpen ? "×" : "☰";
});

mainNav.querySelectorAll("a").forEach(link => {
  link.addEventListener("click", () => {
    mainNav.classList.remove("open");
    menuButton.setAttribute("aria-expanded", "false");
    menuButton.setAttribute("aria-label", "Abrir menú");
    menuButton.textContent = "☰";
  });
});
</script>

</body>
</html>
