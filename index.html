
<!-- CABEZOTE ANDRES MOYANO DESIGN -->
<header class="main-header">
  <a href="#inicio" class="brand">AM<span>.</span></a>

  <button class="menu-toggle" aria-label="Abrir menú"
          aria-expanded="false" aria-controls="main-nav">
    ☰
  </button>

  <nav class="main-nav" id="main-nav">
    <a href="#inicio">INICIO</a>
    <a href="#proyectos">PROYECTOS</a>
    <a href="#sobre-mi">SOBRE MÍ</a>
    <a href="#servicios">SERVICIOS</a>
    <a href="#contacto">CONTACTO</a>
    <button class="language">ES / EN</button>
  </nav>
</header>

<section class="hero" id="inicio">
  <div class="hero-photo"></div>
  <div class="hero-overlay"></div>

  <div class="hero-title">
    <h1 class="animated-name">ANDRES MOYANO</h1>
    <div class="signature">Design</div>
  </div>

  <div class="hero-bottom">
    <span>CREATIVIDAD · ESTRATEGIA · DISEÑO</span>
    <span>COLOMBIA — 2026</span>
  </div>
</section>

<style>
* {
  box-sizing: border-box;
}

.main-header {
  position: absolute;
  z-index: 10;
  top: 0;
  left: 0;
  width: 100%;
  min-height: 78px;
  padding: 18px 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,.48);
  font-family: Arial, sans-serif;
}

.brand {
  color: white;
  font-size: 28px;
  font-weight: 900;
  text-decoration: none;
}

.brand span {
  color: #f5223b;
}

.main-nav {
  display: flex;
  align-items: center;
  gap: 27px;
}

.main-nav a,
.language {
  color: white;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
  text-decoration: none;
  background: none;
  border: 0;
  cursor: pointer;
}

.main-nav a:hover,
.language:hover {
  color: #f5223b;
}

.menu-toggle {
  display: none;
  color: white;
  background: none;
  border: 0;
  font-size: 28px;
  cursor: pointer;
}

.hero {
  min-height: 720px;
  height: 100vh;
  height: 100svh;
  max-height: 1000px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #171717;
  isolation: isolate;
}

.hero-photo {
  position: absolute;
  inset: 0;
  z-index: -2;
  background-image: url("andres-moyano.png");
  background-position: center 40%;
  background-size: cover;
  background-repeat: no-repeat;
  filter: grayscale(100%);
}

.hero-overlay {
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(
    90deg,
    rgba(0,0,0,.28),
    rgba(0,0,0,.08),
    rgba(0,0,0,.28)
  );
}

.hero-title {
  width: 100%;
  text-align: center;
  padding: 20px;
  transform: translateY(8%);
}

.animated-name {
  margin: 0;
  color: #ed1c35;
  font-family: "FuturaMaxi", sans-serif;
  font-size: clamp(38px, 8.2vw, 116px);
  font-weight: 900;
  line-height: .95;
  letter-spacing: -2px;
  white-space: nowrap;
  animation: nameReveal 1.6s ease-out both;
}

.signature {
  color: white;
  font-family: "Brush Script MT", "Segoe Script", cursive;
  font-size: clamp(48px, 8vw, 105px);
  line-height: 1.1;
  margin-top: 12px;
  animation: signatureReveal 2s ease-out 1.4s both;
}

.hero-bottom {
  position: absolute;
  bottom: 25px;
  left: 5%;
  right: 5%;
  display: flex;
  justify-content: space-between;
  color: white;
  font: 10px Arial, sans-serif;
  letter-spacing: 2px;
}

@keyframes nameReveal {
  from {
    opacity: 0;
    clip-path: inset(0 100% 0 0);
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    clip-path: inset(0 0 0 0);
    transform: translateY(0);
  }
}

@keyframes signatureReveal {
  from {
    opacity: 0;
    clip-path: inset(0 100% 0 0);
  }
  to {
    opacity: 1;
    clip-path: inset(0 0 0 0);
  }
}

@media (max-width: 760px) {
  .main-header {
    min-height: 65px;
    padding: 14px 5%;
  }

  .menu-toggle {
    display: block;
  }

  .main-nav {
    display: none;
    position: absolute;
    top: 65px;
    left: 0;
    right: 0;
    padding: 25px;
    background: rgba(0,0,0,.96);
    flex-direction: column;
    align-items: flex-start;
    gap: 24px;
  }

  .main-nav.open {
    display: flex;
  }

  .main-nav a,
  .language {
    font-size: 13px;
  }

  .hero {
    min-height: 620px;
  }

  .hero-photo {
    background-position: center center;
  }

  .animated-name {
    white-space: normal;
    font-size: clamp(36px, 10vw, 68px);
    letter-spacing: -1px;
  }

  .hero-title {
    padding: 15px;
  }

  .hero-bottom {
    font-size: 8px;
    letter-spacing: 1px;
    gap: 12px;
  }
}

@media (max-width: 380px) {
  .hero-bottom {
    flex-direction: column;
    align-items: center;
  }
}

@media (prefers-reduced-motion: reduce) {
  .animated-name,
  .signature {
    animation: none;
    opacity: 1;
    clip-path: none;
  }
}
</style>

<script>
const menuButton = document.querySelector(".menu-toggle"); 
const mainNav = document.querySelector(".main-nav");

menuButton.addEventListener("click", () => {
  const isOpen = mainNav.classList.toggle("open");
  menuButton.setAttribute("aria-expanded", isOpen);
  menuButton.textContent = isOpen ? "×" : "☰";
});

mainNav.querySelectorAll("a").forEach(link => {
  link.addEventListener("click", () => {
    mainNav.classList.remove("open");
    menuButton.setAttribute("aria-expanded", "false");
    menuButton.textContent = "☰";
  });
});
</script>
